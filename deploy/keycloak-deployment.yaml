# Plain Kubernetes/OpenShift Deployment for the custom Keycloak image.
# No Operator, no Helm. Replace every <<< PLACEHOLDER >>> before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          # Tag must match Chart/app version and the base image in the Containerfile.
          image: "<<< REPLACE with registry/namespace/keycloak-request-ip:26.7.4 >>>"
          args: ["start", "--optimized"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # --- Real client IP -------------------------------------------------------
            # Without these two, ClientConnection#getRemoteAddr() — and therefore the
            # ip_address claim — reports the OpenShift router pod's IP, not the caller's.
            #
            # xforwarded: honour X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # Keycloak 26 only honours the forwarded headers when the immediate peer is in
            # this list. Set it to the CIDR the ingress/router pods run in — NOT 0.0.0.0/0,
            # which would let any caller spoof its own IP into the claim.
            # On OpenShift the routers run in the cluster pod network; find yours with:
            #   oc get network.config/cluster -o jsonpath='{.status.clusterNetwork[*].cidr}'
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: "<<< REPLACE: router/ingress pod CIDR, e.g. 10.128.0.0/14 >>>"

            # --- Hostname -------------------------------------------------------------
            - name: KC_HOSTNAME
              value: "<<< REPLACE: https://keycloak.apps.example.com >>>"

            # --- Database (matches --db=postgres baked in at image build time) ---------
            - name: KC_DB_URL
              value: "<<< REPLACE: jdbc:postgresql://postgres:5432/keycloak >>>"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password

            # --- Bootstrap admin (remove once a real admin account exists) -------------
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

          # Requires --health-enabled=true in the Containerfile's kc.sh build options.
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi

          securityContext:
            runAsNonRoot: true
            # runAsUser is intentionally unset: OpenShift assigns a UID from the project's
            # range; on vanilla Kubernetes the image's own USER (1000) applies.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: keycloak-data
              mountPath: /opt/keycloak/data

      volumes:
        - name: tmp
          emptyDir: {}
        - name: keycloak-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  # The HAProxy router appends X-Forwarded-For by default
  # (ROUTER_SET_FORWARDED_HEADERS=append), so no annotation is normally needed. Only if
  # your cluster's IngressController default was changed to "never" or "if-none" do you
  # need to force it back on this Route:
  #
  # annotations:
  #   haproxy.router.openshift.io/set-forwarded-headers: "append"
spec:
  host: "<<< REPLACE with keycloak.apps.example.com >>>"
  to:
    kind: Service
    name: keycloak
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
